name: Unzip Project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak dan commit
        run: |
          unzip -q OdoCare.zip -d _tmp
          rsync -a --exclude='.github' _tmp/OdoCare/ ./
          rm -rf _tmp OdoCare.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ekstrak proyek OdoCare"
          git push
