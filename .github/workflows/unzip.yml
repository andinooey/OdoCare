name: Unzip Project

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP file
        run: |
          ZIP_PATH=".github/workflows/OdoCare.zip"
          if [ -f "$ZIP_PATH" ]; then
            echo "Mengekstrak..."
            unzip -o "$ZIP_PATH" -d .
            rm "$ZIP_PATH"
          else
            echo "❌ OdoCare.zip tidak ditemukan!"
            exit 1
          fi

      - name: Commit and Push Hasil Ekstrak
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # HANYA tambahkan file proyek, jangan folder .github
          git add app/ build.gradle.kts settings.gradle.kts gradle.properties
          
          # Lakukan commit
          git commit -m "Auto-extract OdoCare files ke root" || echo "Tidak ada perubahan"
          
          # Push ke repository
          git push
