name: Unzip Project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak dan commit
        run: |
          Z=""
          [ -f OdoCare.zip ] && Z="OdoCare.zip"
          [ -z "$Z" ] && [ -f .github/workflows/OdoCare.zip ] && Z=".github/workflows/OdoCare.zip"
          if [ -z "$Z" ]; then echo "OdoCare.zip tidak ditemukan"; exit 1; fi
          echo "Memakai $Z"
          unzip -q "$Z" -d _tmp
          rsync -a --exclude='.github' _tmp/OdoCare/ ./
          rm -rf _tmp "$Z"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Tidak ada perubahan" || (git commit -m "Ekstrak proyek OdoCare" && git push)
