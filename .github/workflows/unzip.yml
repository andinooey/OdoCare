name: Unzip Project

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP file
        run: |
          # Membaca file zip dari dalam folder .github/workflows
          ZIP_PATH=".github/workflows/OdoCare.zip"
          
          if [ -f "$ZIP_PATH" ]; then
            echo "File ditemukan di $ZIP_PATH. Mengekstrak..."
            
            # Ekstrak isi zip ke halaman paling depan (root)
            unzip -o "$ZIP_PATH" -d .
            
            # Hapus file zip agar repository bersih
            rm "$ZIP_PATH"
            echo "Ekstraksi selesai!"
          else
            echo "❌ OdoCare.zip tidak ditemukan di $ZIP_PATH!"
            exit 1
          fi

      - name: Commit and Push Hasil Ekstrak
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Auto-extract OdoCare.zip ke root"
          git push
